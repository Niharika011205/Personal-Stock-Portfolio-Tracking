steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stock-portfolio-tracker:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stock-portfolio-tracker:latest'
      - '.'

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stock-portfolio-tracker:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=k8s/'
      - '--image=gcr.io/$PROJECT_ID/stock-portfolio-tracker:$SHORT_SHA'
      - '--location=us-central1'
      - '--cluster=default-cluster'

images:
  - 'gcr.io/$PROJECT_ID/stock-portfolio-tracker:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/stock-portfolio-tracker:latest'

options:
  machineType: 'N1_HIGHCPU_8'

substitutions:
  _SERVICE_ACCOUNT_EMAIL: 'cloud-run-service@${PROJECT_ID}.iam.gserviceaccount.com'
